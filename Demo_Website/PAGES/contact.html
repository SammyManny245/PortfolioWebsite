<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Leal - Contacts</title>
</head>
<body>

    <button onclick="history.back()">Go Back</button>
    <div class="contact-container">
        <div class="contact-info">
            <div>
                <h2>Get in touch</h2>
                <p>I will always listen to all requests. You just hit me up with the message or a job opportunity.</p>
            </div>
            
            <div class="info-details">
                <div class="info-item">
                    <h4>Address</h4>
                    <p>2751 N Sierra Way<br>San Bernardino, CA 92405</p>
                </div>
                <div class="info-item">
                    <h4>Phone</h4>
                    <p>+1 (909)-454-9005</p>
                </div>
                <div class="info-item">
                    <h4>Email</h4>
                    <a href="mailto:samuelleal047@gmail.com">samuelleal047@gmail.com</a>
                </div>
            </div>
        </div>

        <div class="contact-form-wrapper">
            <h3>Send a Message</h3>
            <form action="https://formspree.io" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="How can I help?" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
    <img src=".IMAGES/jesus.gif"</img>
</body>
</html>
